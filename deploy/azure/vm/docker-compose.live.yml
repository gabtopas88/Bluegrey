services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway
    restart: unless-stopped
    environment:
      - TWS_USERID=${TWS_USERID:-}
      - TWS_PASSWORD=${TWS_PASSWORD:-}
      - TRADING_MODE=${TRADING_MODE:-paper}
      - VNC_SERVER_PASSWORD=${VNC_SERVER_PASSWORD:-}
    volumes:
      - ib_gateway_state:/home/ibgateway/Jts
      - ib_gateway_logs:/home/ibgateway/logs
    networks:
      - bluegrey_live_internal

  bluegrey-live:
    build:
      context: ../../..
      dockerfile: docker/live.Dockerfile
    container_name: bluegrey-live
    restart: unless-stopped
    environment:
      - IB_HOST=ib-gateway
      - IB_PORT=${IB_PORT:-4004}
      - IB_CLIENT_ID=${IB_CLIENT_ID:-202}
      - IB_ACCOUNT=${IB_ACCOUNT:-}
      - IB_MARKET_DATA_TYPE=${IB_MARKET_DATA_TYPE:-3}
      - ENABLE_ORDER_SUBMISSION=${ENABLE_ORDER_SUBMISSION:-false}
      - STATE_DIR=/app/state
      - BLUEGREY_UNIVERSE=${BLUEGREY_UNIVERSE:-SPY:STK}
    depends_on:
      - ib-gateway
    volumes:
      - bluegrey_live_state:/app/state
      - bluegrey_live_logs:/app/logs
    networks:
      - bluegrey_live_internal

networks:
  bluegrey_live_internal:

volumes:
  ib_gateway_state:
  ib_gateway_logs:
  bluegrey_live_state:
  bluegrey_live_logs:
